<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영화 후레싱 3D | U바</title><style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#e7edf5;background:#101820}*{box-sizing:border-box}body{margin:0}header{height:64px;border-bottom:1px solid #33404d;display:flex;align-items:center;justify-content:space-between;padding:0 25px}header strong{font-size:19px}header span{color:#9eacba;font-size:12px}.shell{display:grid;grid-template-columns:1fr 315px;height:calc(100vh - 64px);min-height:580px}main{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#26384b,#121d28 70%)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;bottom:18px;left:22px;color:#a7b7c7;font-size:13px;pointer-events:none}.tag{position:absolute;top:20px;left:22px;background:#24384a;padding:9px 12px;border-radius:8px;font-size:13px;color:#c9d9e9}aside{border-left:1px solid #33404d;padding:24px;background:#18232e;overflow:auto}h2{margin:0 0 7px;font-size:19px}p{font-size:12px;color:#9eafc0;line-height:1.65;margin:0 0 24px}.field{margin:15px 0}.field label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:#c6d3e0}.field input[type=range]{width:100%;accent-color:#70b7df}.field input[type=color]{width:100%;height:37px;background:transparent;border:1px solid #4b5c6d;border-radius:6px}.buttons{display:flex;gap:8px;margin-top:25px}button{background:#2b4a62;color:#e9f5ff;border:1px solid #456a84;border-radius:7px;padding:11px 12px;cursor:pointer;flex:1}button:hover{background:#3b6582}.note{border-top:1px solid #33404d;padding-top:18px;margin-top:24px;color:#92a6b8;font-size:12px;line-height:1.7}@media(max-width:780px){.shell{grid-template-columns:1fr;height:auto}main{height:58vh;min-height:350px}aside{border-left:0;border-top:1px solid #33404d}header{padding:0 14px}}
</style></head><body><header><strong>YOUNGHWA <span> / 후레싱 3D 작업실</span></strong><span>U-BAR · 개발용 v1.2</span></header><div class="shell"><main><canvas id="view"></canvas><div class="tag">U바 · 실시간 3D 형상</div><div class="hint">드래그: 회전 &nbsp;|&nbsp; 휠: 확대·축소 &nbsp;|&nbsp; 터치: 회전</div></main><aside><h2>U바 치수 설정</h2><p>이미지 기준 U형 후레싱입니다. 현재 값은 실제 제작 치수가 아닌 예시입니다.</p><div id="fields"></div><div class="field"><label>강판 색상</label><input type="color" id="color" value="#9ab3c5"></div><div class="buttons"><button id="resetView">시점 초기화</button><button id="resetAll">전체 초기화</button></div><div class="note">단위: mm · 양쪽 상단 180° 헤밍(안쪽 되접힘)<br>별도 라이브러리 없이 오프라인 실행 가능<br>회사 영화정보센터에 최종 통합 예정</div></aside></div><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const defaults={width:200,left:120,right:120,length:400,thickness:0.5,hem:15};let values={...defaults},yaw=-.65,pitch=.48,zoom=1.05,drag=false,lastX=0,lastY=0;const config=[['width','바닥 폭',60,500,5],['left','왼쪽 높이',20,350,5],['right','오른쪽 높이',20,350,5],['length','전체 길이',100,1000,10],['thickness','강판 두께',0.4,1.2,0.1],['hem','상단 되접힘 길이',5,60,1]];const fields=document.getElementById('fields');for(const [key,label,min,max,step] of config){const box=document.createElement('div');box.className='field';const lab=document.createElement('label');const val=document.createElement('span');lab.textContent=label;val.textContent=values[key]+' mm';lab.append(val);const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=values[key];input.addEventListener('input',()=>{values[key]=+input.value;val.textContent=values[key]+' mm';draw()});box.append(lab,input);fields.append(box);input.dataset.key=key}
function hexrgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}function shade(rgb,f){return 'rgb('+rgb.map(v=>Math.round(Math.max(0,Math.min(255,v*f)))).join(',')+')'}
function resize(){let dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function project(p){const [x,y,z]=p;let xx=x*Math.cos(yaw)-z*Math.sin(yaw),zz=x*Math.sin(yaw)+z*Math.cos(yaw);let yy=y*Math.cos(pitch)-zz*Math.sin(pitch),depth=y*Math.sin(pitch)+zz*Math.cos(pitch);let s=Math.min(canvas.clientWidth/850,canvas.clientHeight/650)*zoom*1.75;return {x:canvas.clientWidth/2+xx*s,y:canvas.clientHeight/2-yy*s,depth}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(!w||!h)return;const {width:W,left:L,right:R,length:D,thickness:T,hem:H}=values;const scale=380/Math.max(W,L,R,D);const x0=-W/2*scale,x1=W/2*scale,z0=-D/2*scale,z1=D/2*scale,l=L*scale,r=R*scale,t=Math.max(1.2,T*scale);const hem=Math.min(H*scale,l-t*2,r-t*2),gap=Math.max(t*.5,0.8);const polys=[];function face(points,f){const pts=points.map(project);polys.push({pts,depth:pts.reduce((a,b)=>a+b.depth,0)/pts.length,f})}function slab(xa,xb,ya,yb,za,zb,f){face([[xa,yb,za],[xb,yb,za],[xb,yb,zb],[xa,yb,zb]],f);face([[xa,ya,za],[xb,ya,za],[xb,yb,za],[xa,yb,za]],f*.78);face([[xb,ya,za],[xb,ya,zb],[xb,yb,zb],[xb,yb,za]],f*.7);face([[xa,ya,zb],[xb,ya,zb],[xb,yb,zb],[xa,yb,zb]],f*.84);face([[xa,ya,za],[xa,ya,zb],[xa,yb,zb],[xa,yb,za]],f*.67);face([[xa,ya,za],[xb,ya,za],[xb,ya,zb],[xa,ya,zb]],f*.55)}slab(x0,x1,0,t,z0,z1,1);slab(x0,x0+t,t,l,z0,z1,.94);slab(x1-t,x1,t,r,z0,z1,.94);/* Both edges fold back downward along the inside of the U. */slab(x0+t+gap,x0+2*t+gap,l-hem,l,z0,z1,.82);slab(x1-2*t-gap,x1-t-gap,r-hem,r,z0,z1,.82);/* Closed rolled tops visually bridge the upright and the return. */slab(x0,x0+2*t+gap,l-t,l+t*.55,z0,z1,1.04);slab(x1-2*t-gap,x1,r-t,r+t*.55,z0,z1,1.04);polys.sort((a,b)=>a.depth-b.depth);let rgb=hexrgb(document.getElementById('color').value);for(const poly of polys){ctx.beginPath();poly.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=shade(rgb,poly.f);ctx.fill();ctx.strokeStyle='rgba(15,35,50,.50)';ctx.lineWidth=.8;ctx.stroke()}/* Hem return edges: draw visible inside folds as distinct technical outlines.
   A thin real-world 0.5mm sheet needs enhanced on-screen edge visibility. */
function strokeLine(a,b,color,lineWidth){const p=project(a),q=project(b);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.stroke()}
const eps=Math.max(2.3,t*1.5),edge='#dfe8e5',fold='#243541';
/* inner return lips run along the full extrusion; near and far ends show their depth */
for(const [outer,inner,top,dir] of [[x0,x0+2*t+gap,l,1],[x1,x1-2*t-gap,r,-1]]){
const ix=inner,ox=outer+dir*(t+gap),end=top-hem;
for(const z of [z0,z1]){
strokeLine([ix,top,z],[ix,end,z],edge,2.4);
strokeLine([ix,end,z],[ox,end,z],fold,2.2);
strokeLine([outer,top,z],[ix,top,z],edge,2.5)
}
strokeLine([ix,end,z0],[ix,end,z1],edge,2.6);
strokeLine([ix,top,z0],[ix,top,z1],edge,1.7)
}
}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-lastY)*.007));lastX=e.clientX;lastY=e.clientY;draw()});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});document.getElementById('color').addEventListener('input',draw);document.getElementById('resetView').onclick=()=>{yaw=-.65;pitch=.48;zoom=1.05;draw()};document.getElementById('resetAll').onclick=()=>{values={...defaults};document.querySelectorAll('input[data-key]').forEach(el=>{el.value=values[el.dataset.key];el.previousElementSibling.lastChild.textContent=values[el.dataset.key]+' mm'});document.getElementById('color').value='#9ab3c5';yaw=-.65;pitch=.48;zoom=1.05;draw()};new ResizeObserver(resize).observe(canvas);resize()})();
</script></body></html>
